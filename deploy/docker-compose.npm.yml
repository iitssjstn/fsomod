# Voor Nginx Proxy Manager (NPM).
# Kopieer dit bestand op de VPS naar:  docker-compose.override.yml
# `docker compose` (en de deploy-workflow) leest het dan automatisch mee.
#
# Zet NPM_NETWORK in .env op de naam van het Docker-netwerk van NPM.
# Zoek die naam op met:  docker network ls   (vaak iets als "npm_default" of "nginx-proxy-manager_default")
#
# In NPM: Proxy Host → Forward Hostname "fs25-sabotage", poort 3000, Websockets Support AAN.

services:
  app:
    container_name: fs25-sabotage
    networks:
      - default
      - npm

networks:
  npm:
    external: true
    name: ${NPM_NETWORK:-npm_default}
