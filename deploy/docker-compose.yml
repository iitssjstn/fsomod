# Losse compose voor FS25 Twitch Sabotage.
# Heb je al een compose met Nginx Proxy Manager? Gebruik dan compose-snippet.yml.
#
# Geen .env en geen geheimen nodig: Twitch-keys stel je in op https://<jouw-domein>/admin
# (installatiecode staat in: docker logs fs25-sabotage)

services:
  fs25-sabotage:
    image: ghcr.io/iitssjstn/fsomod:latest
    container_name: fs25-sabotage
    restart: unless-stopped
    pull_policy: always
    volumes:
      - fs25-sabotage-data:/data
    ports:
      # alleen lokaal; je reverse proxy stuurt door naar poort 3000
      - "127.0.0.1:3000:3000"

volumes:
  fs25-sabotage-data:
