# Blok voor een BESTAANDE docker-compose.yml waarin Nginx Proxy Manager draait.
# Alle services in die compose delen één netwerk, dus NPM bereikt de app via "fs25-sabotage:3000".
#
# Geen .env en geen geheimen: Twitch-keys stel je in op https://<jouw-domein>/admin
# (installatiecode staat in: docker logs fs25-sabotage)

services:
  fs25-sabotage:
    image: ghcr.io/iitssjstn/fsomod:latest
    container_name: fs25-sabotage
    restart: unless-stopped
    pull_policy: always
    environment:
      - TZ=Europe/Amsterdam
    volumes:
      - fs25-sabotage-data:/data
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  fs25-sabotage-data:
