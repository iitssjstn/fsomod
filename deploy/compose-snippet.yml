# Blok om toe te voegen aan een BESTAANDE docker-compose.yml waarin Nginx Proxy Manager al draait.
# Alle services in die compose delen hetzelfde netwerk, dus NPM bereikt de app via "fs25-sabotage:3000".
# De geheimen komen uit het .env-bestand naast je docker-compose.yml.

services:
  fs25-sabotage:
    image: ghcr.io/iitssjstn/fsomod:latest
    container_name: fs25-sabotage
    restart: unless-stopped
    pull_policy: always
    environment:
      - TZ=Europe/Amsterdam
      - BASE_URL=https://sabotage.jouwdomein.nl
      - TWITCH_CLIENT_ID=${FS25_TWITCH_CLIENT_ID}
      - TWITCH_CLIENT_SECRET=${FS25_TWITCH_CLIENT_SECRET}
      - SESSION_SECRET=${FS25_SESSION_SECRET}
      - EVENTSUB_SECRET=${FS25_EVENTSUB_SECRET}
    volumes:
      - fs25-sabotage-data:/data
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  fs25-sabotage-data:
